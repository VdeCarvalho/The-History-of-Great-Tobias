<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f5"/>
      <stop offset=".32" stop-color="#aebbc2"/>
      <stop offset=".68" stop-color="#6d7a83"/>
      <stop offset="1" stop-color="#d4dde2"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87949c"/>
      <stop offset="1" stop-color="#48545d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478bd"/>
      <stop offset="1" stop-color="#164b83"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- long rabbit ears -->
    <g transform="rotate(-8 82 62)">
      <rect x="63" y="3" width="38" height="105" rx="19" fill="#f8f7f2" stroke="#303a41" stroke-width="5"/>
      <rect x="73" y="15" width="18" height="79" rx="9" fill="#ef9eaa"/>
    </g>
    <g transform="rotate(8 174 62)">
      <rect x="155" y="3" width="38" height="105" rx="19" fill="#f8f7f2" stroke="#303a41" stroke-width="5"/>
      <rect x="165" y="15" width="18" height="79" rx="9" fill="#ef9eaa"/>
    </g>

    <!-- blue cape/scarf -->
    <path d="M77 213 Q128 188 179 213 L169 250 H87z" fill="url(#blue)" stroke="#21394f" stroke-width="5"/>
    <path d="M93 215 Q128 235 163 215" fill="none" stroke="#75b5ef" stroke-width="4" opacity=".75"/>

    <!-- bunny head -->
    <ellipse cx="128" cy="148" rx="72" ry="70" fill="#faf9f5" stroke="#303a41" stroke-width="6"/>
    <ellipse cx="72" cy="164" rx="18" ry="28" fill="#f4f2ec" stroke="#303a41" stroke-width="5"/>
    <ellipse cx="184" cy="164" rx="18" ry="28" fill="#f4f2ec" stroke="#303a41" stroke-width="5"/>

    <!-- medieval open helmet -->
    <path d="M57 119 Q60 58 128 49 Q196 58 199 119
             L180 124 Q171 86 128 80 Q85 86 76 124z"
          fill="url(#steel)" stroke="#303a41" stroke-width="6"/>
    <path d="M64 118 L47 132 L52 177 L76 171 L78 123z"
          fill="url(#steelDark)" stroke="#303a41" stroke-width="5"/>
    <path d="M192 118 L209 132 L204 177 L180 171 L178 123z"
          fill="url(#steelDark)" stroke="#303a41" stroke-width="5"/>
    <path d="M128 50 V79" stroke="#eef3f5" stroke-width="5" stroke-linecap="round"/>
    <path d="M81 105 Q128 84 175 105" fill="none" stroke="#46545d" stroke-width="5"/>
    <circle cx="70" cy="131" r="4.5" fill="#e6c66b" stroke="#303a41" stroke-width="2"/>
    <circle cx="186" cy="131" r="4.5" fill="#e6c66b" stroke="#303a41" stroke-width="2"/>

    <!-- muzzle -->
    <ellipse cx="128" cy="169" rx="39" ry="30" fill="#ffffff" opacity=".72"/>
    <path d="M121 158 Q128 153 135 158 Q133 166 128 168 Q123 166 121 158z"
          fill="#d87983" stroke="#6f3d43" stroke-width="2"/>

    
    <!-- angry eyes -->
    <path d="M88 132 Q103 122 116 132" fill="none" stroke="#47312c" stroke-width="7" stroke-linecap="round"/>
    <path d="M140 132 Q153 122 168 132" fill="none" stroke="#47312c" stroke-width="7" stroke-linecap="round"/>
    <path d="M90 119 L112 127" stroke="#47312c" stroke-width="7" stroke-linecap="round"/>
    <path d="M166 119 L144 127" stroke="#47312c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="103" cy="136" r="5" fill="#1f2528"/>
    <circle cx="153" cy="136" r="5" fill="#1f2528"/>
    <path d="M105 188 Q128 175 151 188 L146 200 H110z" fill="#4d2525" stroke="#352020" stroke-width="4"/>
    <path d="M111 188 H145" stroke="#f5f0e8" stroke-width="6"/>
    <!-- anger mark -->
    <path d="M188 83 l12 -8 m-12 8 l4 -13 m-4 13 l13 3 m-13 -3 l-2 13"
          stroke="#d94c45" stroke-width="6" stroke-linecap="round"/>
    
  </g>
</svg>