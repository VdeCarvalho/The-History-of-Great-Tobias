<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja dos Docinhos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .shop {
      width: min(960px, 96vw);
      border: 4px solid #fff;
      background: #050505;
      box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff;
    }

    .topbar {
      padding: 14px 20px;
      border-bottom: 4px solid #fff;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      font-weight: bold;
      font-size: 18px;
    }

    .scene {
      min-height: 420px;
      display: grid;
      grid-template-columns: 34% 66%;
      border-bottom: 4px solid #fff;
      position: relative;
      overflow: hidden;
    }

    .seller-area {
      border-right: 4px solid #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 16px 20px;
      background: linear-gradient(180deg, #0b0b0b 0 64%, #161616 64% 100%);
    }

    .seller {
      width: 140px;
      height: 180px;
      position: relative;
      margin-bottom: 18px;
    }

    .head {
      width: 88px;
      height: 88px;
      border: 4px solid #fff;
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      background: #000;
    }

    .eye {
      position: absolute;
      top: 30px;
      width: 8px;
      height: 8px;
      background: #fff;
    }

    .eye.left { left: 22px; }
    .eye.right { right: 22px; }

    .mouth {
      position: absolute;
      width: 34px;
      height: 4px;
      background: #fff;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .body {
      width: 120px;
      height: 90px;
      border: 4px solid #fff;
      border-bottom: 0;
      margin: -2px auto 0;
      border-radius: 34px 34px 0 0;
    }

    .speech {
      width: 100%;
      border: 3px solid #fff;
      padding: 14px;
      font-size: clamp(20px, 3vw, 30px);
      text-align: center;
      background: #000;
    }

    .display-area {
      position: relative;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.08), transparent 32%),
        repeating-linear-gradient(0deg, #080808 0px, #080808 32px, #101010 32px, #101010 64px);
    }

    .product-card {
      width: min(460px, 95%);
      border: 4px solid #fff;
      padding: 24px;
      text-align: center;
      background: #060606;
    }

    .potato {
      width: 160px;
      height: 116px;
      border: 4px solid #fff;
      border-radius: 50% 45% 48% 52%;
      position: relative;
      cursor: pointer;
      background: #1c1c1c;
      transition: transform .12s ease, box-shadow .12s ease;
      margin: 8px auto 18px;
      display: block;
    }

    .potato:hover {
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(255,255,255,.35);
    }

    .potato::before,
    .potato::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      opacity: .7;
    }

    .potato::before { left: 36px; top: 30px; }
    .potato::after { right: 32px; bottom: 28px; }

    .product-name {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .buy {
      width: 100%;
      border: 3px solid #fff;
      padding: 12px 16px;
      font: inherit;
      font-weight: bold;
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    .buy:hover:not(:disabled) {
      background: #fff;
      color: #000;
    }

    .buy:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .dialogue {
      padding: 22px 24px;
      min-height: 150px;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.45;
      display: flex;
      align-items: center;
    }

    .dialogue::before {
      content: "*";
      margin-right: 14px;
      align-self: flex-start;
    }

    .footer {
      padding: 18px 24px 22px;
      text-align: right;
      border-top: 4px solid #fff;
    }

    .back {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      border: 3px solid #fff;
      padding: 11px 16px;
      font-weight: bold;
    }

    .back:hover {
      background: #fff;
      color: #000;
    }


    .potato.common { border-color: #9a9a9a; background: #555; box-shadow: 0 0 18px rgba(160,160,160,.22); }
    .potato.uncommon { border-color: #45c96b; background: #173d23; box-shadow: 0 0 22px rgba(69,201,107,.34); }
    .potato.rare { border-color: #4388ff; background: #142b55; box-shadow: 0 0 24px rgba(67,136,255,.40); }
    .potato.epic { border-color: #b24cff; background: #35134d; box-shadow: 0 0 26px rgba(178,76,255,.46); }
    .potato.legendary { border-color: #f7c843; background: #544411; box-shadow: 0 0 28px rgba(247,200,67,.52); }
    .potato.unique { border-color: #ff3b3b; background: #521515; box-shadow: 0 0 30px rgba(255,59,59,.58); }
    .potato.infernal {
      border-color: #1a1a1a;
      background: #000;
      box-shadow: 0 0 10px #000, 0 0 34px rgba(0,0,0,.95);
    }
    .potato.divine {
      border-color: #fff;
      background: #ededed;
      box-shadow: 0 0 12px #fff, 0 0 38px rgba(255,255,255,.85);
    }


    .products {
      width: min(520px, 95%);
      display: grid;
      gap: 18px;
    }
    .product-card {
      width: 100%;
    }
    .auto-icon {
      width: 160px;
      height: 116px;
      margin: 8px auto 18px;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      background: #111;
      box-shadow: 0 0 22px rgba(255,255,255,.18);
    }
    .switch-button.on {
      background: #fff;
      color: #000;
    }

    @media (max-width: 700px) {
      .scene { grid-template-columns: 1fr; }
      .seller-area {
        border-right: 0;
        border-bottom: 4px solid #fff;
      }
      .seller {
        transform: scale(.85);
        margin-bottom: 6px;
      }
    }
  </style>
</head>
<body>
  <audio id="shopBgMusic" src="musica_original.wav" loop preload="auto"></audio>
<audio id="shopClickSound" src="click_simpatico.wav" preload="auto"></audio>
<main class="shop">
    <div class="topbar">
      <span>🍬 Docinhos: <span id="candies">0</span></span>
      <span>🥔 Batatas compradas: <span id="level">0</span></span>
      <span id="autoStatusShop">⚙️ Auto-Cliquer: OFF</span>
    </div>

    <section class="scene">
      <div class="seller-area">
        <div class="seller" aria-label="Vendedor">
          <div class="head">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="mouth"></span>
          </div>
          <div class="body"></div>
        </div>
        <div class="speech">Olá!</div>
      </div>

      <div class="display-area">
        <div class="products">
          <div class="product-card">
            <button class="potato common" id="potato" aria-label="Batata mágica"></button>
            <div class="product-name" id="productName">BATATA COMUM</div>
            <div class="price">Preço: 🍬 <strong id="price">200</strong></div>
            <button class="buy" id="buyButton">COMPRAR</button>
          </div>

          <div class="product-card">
            <div class="auto-icon">⚙️</div>
            <div class="product-name">AUTO-CLIQUER</div>
            <div class="price" id="autoPriceLine">Preço: 🍬 <strong id="autoPrice">1.000</strong></div>
            <button class="buy switch-button" id="autoBuyButton">COMPRAR</button>
          </div>
        </div>
      </div>
    </section>

    <section class="dialogue" id="dialogue">
      Clique na batata para ver o que ela faz.
    </section>

    <div class="footer">
      <a class="back" href="index.html">← VOLTAR AO JOGO</a>
    </div>
  </main>

  <script>


    function saveMusicPosition(audioEl) {
      if (!audioEl || !Number.isFinite(audioEl.currentTime)) return;
      localStorage.setItem("musicPosition", String(audioEl.currentTime));
      localStorage.setItem("musicSavedAt", String(Date.now()));
    }

    function restoreMusicPosition(audioEl) {
      const saved = Number(localStorage.getItem("musicPosition"));
      const savedAt = Number(localStorage.getItem("musicSavedAt"));

      if (!Number.isFinite(saved) || saved < 0) return;

      let target = saved;

      // If the music was playing when we changed page, approximate elapsed navigation time.
      if (localStorage.getItem("musicEnabled") !== "false" && Number.isFinite(savedAt)) {
        target += Math.max(0, (Date.now() - savedAt) / 1000);
      }

      const apply = () => {
        const dur = audioEl.duration;
        if (Number.isFinite(dur) && dur > 0) {
          audioEl.currentTime = target % dur;
        } else {
          audioEl.currentTime = target;
        }
      };

      if (audioEl.readyState >= 1) apply();
      else audioEl.addEventListener("loadedmetadata", apply, { once: true });
    }

    const shopBgMusic = document.getElementById("shopBgMusic");
    const shopClickSound = document.getElementById("shopClickSound");
    let shopMusicUnlocked = false;

    shopBgMusic.volume = 0.36;
    restoreMusicPosition(shopBgMusic);

    function playShopClickSound() {
      try {
        const sound = shopClickSound.cloneNode();
        sound.volume = 0.48;
        sound.play().catch(() => {});
      } catch (e) {}
    }

    document.addEventListener("click", () => {
      playShopClickSound();
    }, true);

    async function unlockShopMusic() {
      if (localStorage.getItem("musicEnabled") === "false") return;
      try {
        await shopBgMusic.play();
        shopMusicUnlocked = true;
      } catch (e) {
        shopMusicUnlocked = false;
      }
    }

    async function unlockShopMusicOnce() {
      await unlockShopMusic();
      if (shopMusicUnlocked) {
        document.removeEventListener("pointerdown", unlockShopMusicOnce);
        document.removeEventListener("keydown", unlockShopMusicOnce);
      }
    }

    document.addEventListener("pointerdown", unlockShopMusicOnce);
    document.addEventListener("keydown", unlockShopMusicOnce);

    if (localStorage.getItem("musicEnabled") !== "false") {
      shopBgMusic.play().then(() => {
        shopMusicUnlocked = true;
      }).catch(() => {
        shopMusicUnlocked = false;
      });
    }

    setInterval(() => saveMusicPosition(shopBgMusic), 500);
    window.addEventListener("pagehide", () => saveMusicPosition(shopBgMusic));
    window.addEventListener("beforeunload", () => saveMusicPosition(shopBgMusic));


    localStorage.removeItem("shopPhraseText");
    const candiesEl = document.getElementById("candies");
    const levelEl = document.getElementById("level");
    const priceEl = document.getElementById("price");
    const productNameEl = document.getElementById("productName");
    const dialogueEl = document.getElementById("dialogue");
    const buyButton = document.getElementById("buyButton");
    const potato = document.getElementById("potato");
    const autoBuyButton = document.getElementById("autoBuyButton");
    const autoPriceLine = document.getElementById("autoPriceLine");
    const AUTO_CLICKER_PRICE = 1000;
    const autoStatusShop = document.getElementById("autoStatusShop");
    let shopAutoTimer = null;

    const potatoTiers = [
      { name: "COMUM", css: "common" },
      { name: "INCOMUM", css: "uncommon" },
      { name: "RARA", css: "rare" },
      { name: "ÉPICA", css: "epic" },
      { name: "LENDÁRIA", css: "legendary" },
      { name: "ÚNICA", css: "unique" },
      { name: "INFERNAL", css: "infernal" },
      { name: "DIVINA", css: "divine" }
    ];

    function getCandies() {
      return Number(localStorage.getItem("docinhos")) || 0;
    }

    function getLevel() {
      return Number(localStorage.getItem("batataMagicaNivel")) || 0;
    }

    function getPrice(level) {
      return 200 * Math.pow(2, level);
    }

    function formatNumber(value) {
      if (Number.isSafeInteger(value)) return value.toLocaleString("pt-BR");
      return value.toExponential(2).replace(".", ",");
    }


    function ownsAutoClicker() {
      return localStorage.getItem("autoClickerComprado") === "true";
    }

    function isAutoClickerOn() {
      return localStorage.getItem("autoClickerOn") === "true";
    }

    function updateAutoClickerShop() {
      const candies = getCandies();

      if (!ownsAutoClicker()) {
        autoPriceLine.innerHTML = 'Preço: 🍬 <strong>1.000</strong>';
        autoBuyButton.textContent = "COMPRAR";
        autoBuyButton.classList.remove("on");
        autoBuyButton.disabled = candies < AUTO_CLICKER_PRICE;
        return;
      }

      autoPriceLine.textContent = "Comprado · 4 tentativas por segundo";
      const on = isAutoClickerOn();
      autoBuyButton.disabled = false;
      autoBuyButton.textContent = on ? "ON" : "OFF";
      autoBuyButton.classList.toggle("on", on);
    }


    const shopBasePrizes = [
      { name: "Comum",      chance: 88.888889, candies: 1,   rank: 1 },
      { name: "Incomum",    chance: 10,        candies: 2,   rank: 2 },
      { name: "Raro",       chance: 1,         candies: 4,   rank: 3 },
      { name: "Épico",      chance: 0.1,       candies: 8,   rank: 4 },
      { name: "Lendário",   chance: 0.01,      candies: 16,  rank: 5 },
      { name: "Único",      chance: 0.001,     candies: 32,  rank: 6 },
      { name: "Infernal",   chance: 0.0001,    candies: 64,  rank: 7 },
      { name: "Divino",     chance: 0.00001,   candies: 128, rank: 8 },
      { name: "FAÇANHA",    chance: 0.000001,  candies: 0,   rank: 0 }
    ];

    function getAdjustedShopPrizes() {
      const potatoLevel = getLevel();
      const multiplier = Math.pow(3, potatoLevel);

      const prizes = shopBasePrizes.map(p => ({
        ...p,
        chance: p.name === "FAÇANHA" ? p.chance : p.chance * multiplier
      }));

      let total = prizes.reduce((sum, p) => sum + p.chance, 0);
      let overflow = Math.max(0, total - 100);

      const reductionOrder = [
        "Comum", "Incomum", "Raro", "Épico",
        "Lendário", "Único", "Infernal", "Divino"
      ];

      for (const name of reductionOrder) {
        if (overflow <= 0) break;
        const prize = prizes.find(p => p.name === name);
        const reduction = Math.min(prize.chance, overflow);
        prize.chance -= reduction;
        overflow -= reduction;
      }

      return prizes;
    }

    function drawShopPrize() {
      const prizes = getAdjustedShopPrizes();
      const roll = Math.random() * 100;
      let cumulative = 0;

      for (const prize of prizes) {
        cumulative += prize.chance;
        if (roll < cumulative) return prize;
      }

      return prizes[prizes.length - 1];
    }

    function runShopAutoClick() {
      if (!ownsAutoClicker() || !isAutoClickerOn()) return;

      const prize = drawShopPrize();
      const candies = getCandies() + prize.candies;
      localStorage.setItem("docinhos", candies);

      const bestRank = Number(localStorage.getItem("melhorPremioRank")) || 0;
      if (prize.rank > bestRank) {
        localStorage.setItem("melhorPremioRank", prize.rank);
        localStorage.setItem("melhorPremioNome", prize.name);
      }

      updateShop();
    }

    function syncShopAutoClicker() {
      const active = ownsAutoClicker() && isAutoClickerOn();

      autoStatusShop.textContent = active
        ? "⚙️ Auto-Cliquer: ON · 4/s"
        : "⚙️ Auto-Cliquer: OFF";

      if (active && !shopAutoTimer) {
        shopAutoTimer = setInterval(runShopAutoClick, 250);
      } else if (!active && shopAutoTimer) {
        clearInterval(shopAutoTimer);
        shopAutoTimer = null;
      }
    }

    function updateShop() {
      const candies = getCandies();
      const level = getLevel();

      candiesEl.textContent = formatNumber(candies);
      levelEl.textContent = Math.min(level, potatoTiers.length);
      updateAutoClickerShop();
      syncShopAutoClicker();

      potato.className = "potato";

      if (level >= potatoTiers.length) {
        productNameEl.textContent = "BATATAS ESGOTADAS";
        priceEl.textContent = "—";
        potato.classList.add("divine");
        buyButton.disabled = true;
        buyButton.textContent = "ESGOTADO";
        return;
      }

      const tier = potatoTiers[level];
      const price = getPrice(level);

      potato.classList.add(tier.css);
      productNameEl.textContent = "BATATA " + tier.name;
      priceEl.textContent = formatNumber(price);

      buyButton.textContent = "COMPRAR";
      buyButton.disabled = candies < price;
    }

    potato.addEventListener("click", () => {
      const level = getLevel();

      if (level >= potatoTiers.length) {
        dialogueEl.textContent =
          "Você já comprou todas as batatas mágicas, incluindo a Batata Divina.";
        return;
      }

      const tier = potatoTiers[level];
      dialogueEl.textContent =
        "Batata " + tier.name.toLowerCase() +
        " que aumenta a chance de prêmios melhores. Cada batata triplica as chances de todos os prêmios, menos a Façanha.";
    });

    buyButton.addEventListener("click", () => {
      const candies = getCandies();
      const level = getLevel();

      if (level >= potatoTiers.length) {
        dialogueEl.textContent = "Todas as batatas já foram compradas.";
        updateShop();
        return;
      }

      const price = getPrice(level);
      const tier = potatoTiers[level];

      if (candies < price) {
        dialogueEl.textContent = "Você não tem docinhos suficientes.";
        updateShop();
        return;
      }

      localStorage.setItem("docinhos", candies - price);
      localStorage.setItem("batataMagicaNivel", level + 1);

      dialogueEl.textContent =
        "Você comprou a Batata " + tier.name.toLowerCase() +
        "! As chances dos prêmios foram melhoradas.";

      updateShop();
    });


    autoBuyButton.addEventListener("click", () => {
      const candies = getCandies();

      if (!ownsAutoClicker()) {
        if (candies < AUTO_CLICKER_PRICE) {
          dialogueEl.textContent = "Você não tem docinhos suficientes para comprar o Auto-Cliquer.";
          updateShop();
          return;
        }

        localStorage.setItem("docinhos", candies - AUTO_CLICKER_PRICE);
        localStorage.setItem("autoClickerComprado", "true");
        localStorage.setItem("autoClickerOn", "false");
        dialogueEl.textContent =
          "Auto-Cliquer comprado! Agora você pode ligar ou desligar 4 tentativas automáticas por segundo.";
        updateShop();
        return;
      }

      const next = !isAutoClickerOn();
      localStorage.setItem("autoClickerOn", String(next));
      dialogueEl.textContent = next
        ? "Auto-Cliquer ligado: 4 tentativas por segundo."
        : "Auto-Cliquer desligado.";
      updateShop();
    });

    syncShopAutoClicker();
    updateShop();
  </script>
</body>
</html>
