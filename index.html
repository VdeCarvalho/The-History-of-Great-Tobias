<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2b">
  <title>A História do Grande Tobias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="ad-slot" aria-label="Espaço reservado para publicidade"><span>PUBLICIDADE</span></section>

    <section class="game-stage">
      <video id="heroVideo" class="hero-video" autoplay muted loop playsinline preload="auto">
        <source src="tobias_intro.mp4" type="video/mp4">
      </video>

      <div class="stage-vignette"></div>

      <header class="game-title">
        <div class="title-kicker"><span></span>A HISTÓRIA DO<span></span></div>
        <h1>GRANDE<br>TOBIAS</h1>
        <div class="title-ornament"><i></i><b>◆</b><i></i></div>
      </header>

      <nav class="game-actions" aria-label="Menu principal">
        <div class="fantasy-button primary button-slot-placeholder" aria-hidden="true"></div>
        <a class="fantasy-button primary" id="playButton" href="nome.html"><span>JOGAR</span></a>
      </nav>

      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Ligar ou desligar música"><span id="soundIcon">♪</span></button>
      <div class="sound-hint" id="soundHint">toque para ouvir a trilha</div>
      <audio id="bgMusic" src="tobias_theme.mp3" loop preload="auto"></audio>
    </section>
  </main>
  <script src="save-system.js"></script>
  <script src="script.js"></script>
</body>
</html>
